<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Market Regime Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <div class = "container mt-5">
        <div style = "padding-left: 80px;">
            <h1 class = "mb-4">Market Regime Explorer</h1>
            <form method = "POST" class = "d-flex gap-2 mb-4" onsubmit="document.getElementById('submitBtn').innerText='Loading...'; document.getElementById('submitBtn').disabled=true;">
                <input type = "text" name = "ticker" class = "form-control bg-dark text-light border-secondary" style = "max-width: 200px;" placeholder = "Enter a ticker (e.g. SPY)" value = "{{ ticker or '' }}">
                <button type = "submit" id = "submitBtn" class = "btn btn-primary text-nowrap">Get Chart</button>
            </form>
        </div>

        {% if error %}
            <div class = "alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if chart %}
            <div class = "rounded p-3">
                {{ chart | safe }}
            </div>
        {% endif %}

        {% if regime_prob %}
            <div style = "padding-left: 80px;" class = "mb-3">
                <strong>Current Regime Confidence:</strong>
                {% for label, prob in regime_prob.items() %}
                    <span class = "badge bg-secondary me-1">{{ label }}: {{ prob }}%</span>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
